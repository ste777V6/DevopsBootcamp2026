name: trivy scan on PR for infra

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'week6/Infra/**'

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in IaC mode #Install Trivy and run the scan on the week6/Infra directory. The results will be saved in SARIF format to trivy-results.sarif file.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: 'config'
          scan-ref: 'week6/Infra'
          trivyignores: 'week6/Infra/.trivyignore.yaml'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab #Upload the trivy-results.sarif file to the GitHub Security tab. This will allow you to view the scan results in the Security tab of your repository.
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-iac'

      - name: Trivy Iac gate  #Run the Trivy scan again, but this time with exit-code 1. This will cause the workflow to fail if any vulnerabilities are found. The severity is set to CRITICAL and HIGH, so only vulnerabilities with these severities will cause the workflow to fail.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: 'config'
          scan-ref: 'week6/Infra'
          trivyignores: 'week6/Infra/.trivyignore.yaml'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          skip-setup-trivy: true