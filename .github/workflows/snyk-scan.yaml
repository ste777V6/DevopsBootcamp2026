name: Snyk Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Snyk Open Source test
        uses: snyk/actions/python@master
        continue-on-error: true
        with:
          args: >-
            --file=week6/student-portal-for-ECS/requirements.txt
            --package-manager=pip
            --severity-threshold=high
            --sarif-file-output=snyk-oss.sarif

      - name: Snyk IaC test
        uses: snyk/actions/iac@master
        continue-on-error: true
        with:
          file: week6/Infra
          args: --severity-threshold=medium   # action writes snyk.sarif itself

      - name: Snyk monitor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/python@master
        continue-on-error: true
        with:
          command: monitor
          args: >-
            --file=week6/student-portal-for-ECS/requirements.txt
            --package-manager=pip
            --project-name=student-portal

      - name: Upload OSS results
        if: always() && hashFiles('snyk-oss.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      - name: Upload IaC results
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk-iac