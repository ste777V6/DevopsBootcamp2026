name: Snyk Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # needed for SARIF upload

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Open source dependencies (pick the action matching your stack: node, python, golang, maven, docker, iac...)
      - name: Snyk Open Source test
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-oss.sarif
          file: ./week6/student-portal-for-ECS/.

      # Terraform / IaC misconfigurations
      - name: Snyk IaC test
        uses: snyk/actions/iac@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: ./week6/Infra
          args: --severity-threshold=medium --sarif-file-output=snyk-iac.sarif

      # Push a snapshot to the Snyk UI (this is what drives Slack alerts)
      - name: Snyk monitor
        if: github.ref == 'refs/heads/main'
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

      - name: Upload results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      - name: Upload results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac