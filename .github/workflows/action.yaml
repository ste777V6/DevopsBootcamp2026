name: Trivy triage report
description: >
  Turns a Trivy JSON report into a prioritised HTML report (severity, FIRST EPSS,
  CISA KEV), writes a job summary and uploads both as an artifact.
  Never fails the job unless fail-on is set.

inputs:
  input:
    description: Path to the Trivy JSON report
    required: true
  title:
    description: Report title (image, folder or stack name)
    required: true
  artifact-name:
    description: Name of the uploaded artifact (unique per job)
    required: true
  epss-high:
    description: EPSS probability that makes a vulnerability P2
    default: '0.10'
  fail-on:
    description: P1, P2, P3 or none
    default: 'none'

runs:
  using: composite
  steps:
    - name: Triage findings (severity, EPSS, CISA KEV)
      shell: bash
      env:
        TRIAGE_INPUT: ${{ inputs.input }}
        TRIAGE_TITLE: ${{ inputs.title }}
        TRIAGE_ARTIFACT: ${{ inputs.artifact-name }}
        TRIAGE_EPSS_HIGH: ${{ inputs.epss-high }}
        TRIAGE_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/trivy_triage.py" \
          --input "$TRIAGE_INPUT" \
          --title "$TRIAGE_TITLE" \
          --artifact "$TRIAGE_ARTIFACT" \
          --epss-high "$TRIAGE_EPSS_HIGH" \
          --fail-on "$TRIAGE_FAIL_ON" \
          --html "$RUNNER_TEMP/$TRIAGE_ARTIFACT/report.html" \
          --json "$RUNNER_TEMP/$TRIAGE_ARTIFACT/findings.json" \
          --summary "$GITHUB_STEP_SUMMARY"

    - name: Upload triage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}/
        retention-days: 30
        if-no-files-found: warn
